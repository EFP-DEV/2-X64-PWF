  <title>Form ever follows function — Louis H. Sullivan</title>
  <style>
    body {
      color: #000;
      background-color: #000;
    }
  </style>
</head>
<body>
  <main>
    <figure>
      <blockquote>
        <p>
          Whether it be the sweeping eagle in his flight, or the open apple-blossom,
          the toiling work-horse, the blithe swan, the branching oak, the winding
          stream at its base, the drifting clouds, over all the coursing sun, form
          ever follows function, and this is the law. Where function does not change
          form does not change. The granite rocks, the ever-brooding hills, remain
          for ages; the lightning lives, comes into shape, and dies in a twinkling.
        </p>
        <p>
          It is the pervading law of all things organic and inorganic, of all things
          physical and metaphysical, of all things human and all things superhuman,
          of all true manifestations of the head, of the heart, of the soul, that
          the life is recognizable in its expression, that form ever follows
          function. This is the law.
        </p>
        <p>
          Shall we, then, daily violate this law in our art? Are we so decadent, so
          imbecile, so utterly weak of eyesight, that we cannot perceive this truth
          so simple, so very simple?
        </p>
      </blockquote>
      <figcaption>
        — Louis H. Sullivan, <cite>The Tall Office Building Artistically Considered</cite>, 1896.
      </figcaption>
    </figure>
  </main>
